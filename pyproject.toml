[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-solver"
version = "0.1.0"

dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
ocr = ["opencv-python", "tensorflow", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]